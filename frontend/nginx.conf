# /frontend/nginx.conf

server {
    listen 80;
    server_name ec2-3-129-52-245.us-east-2.compute.amazonaws.com;

    # Redireciona HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ec2-3-129-52-245.us-east-2.compute.amazonaws.com;

    # Caminho dos certificados (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/ec2-3-129-52-245.us-east-2.compute.amazonaws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec2-3-129-52-245.us-east-2.compute.amazonaws.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy das requisições /api → backend Django
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA (fallback para index.html)
    location / {
        try_files $uri /index.html;
    }

    error_page 500 502 503 504 /50x.html;
}
