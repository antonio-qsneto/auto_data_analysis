# --------------------------------------------------
# Redireciona HTTP → HTTPS
# --------------------------------------------------
server {
    listen 80;
    server_name xclarity.duckdns.org;

    return 301 https://$host$request_uri;
}

# --------------------------------------------------
# Servidor HTTPS principal
# --------------------------------------------------
server {
    listen 443 ssl;
    server_name xclarity.duckdns.org;

    # Certificados (Certbot)
    ssl_certificate     /etc/letsencrypt/live/xclarity.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xclarity.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Diretório do build do React
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------
    # ✅ Proxy das requisições da API → Django backend
    # --------------------------------------------------
    location /api/ {
        # Mantém o prefixo /api no encaminhamento (ESSENCIAL!)
        proxy_pass http://backend:8000/api/;

        # Cabeçalhos HTTP necessários
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evita buffering que pode causar erros de upload
        proxy_buffering off;
    }

    # --------------------------------------------------
    # React SPA (fallback para index.html)
    # --------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # --------------------------------------------------
    # Páginas de erro padrão
    # --------------------------------------------------
    error_page 500 502 503 504 /50x.html;
}
