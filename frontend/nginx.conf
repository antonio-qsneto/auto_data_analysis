server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redireciona rotas do React
    location / {
        try_files $uri /index.html;
    }

    # Proxy para o backend Django
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
