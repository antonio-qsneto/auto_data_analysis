# --------------------------------------------------
# Redireciona HTTP → HTTPS
# --------------------------------------------------
server {
    listen 80;
    server_name xclarity.duckdns.org;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------
# Servidor HTTPS principal
# --------------------------------------------------
server {
    listen 443 ssl;
    server_name xclarity.duckdns.org;

    # --------------------------------------------------
    # 🔐 Certificados (Certbot)
    # --------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/xclarity.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xclarity.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --------------------------------------------------
    # 📁 Diretório do build do React
    # --------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------
    # ✅ Proxy das requisições da API → Django backend
    # --------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # 🔹 Timeouts para evitar 504 Gateway Timeout
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # 🔹 Headers necessários
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔹 Evita buffering de upload de arquivos grandes
        proxy_request_buffering off;
        proxy_buffering off;

        # 🔹 Mantém o corpo original das respostas longas
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------
    # ⚙️ React SPA (fallback para index.html)
    # --------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # --------------------------------------------------
    # 📦 Otimizações gerais
    # --------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # --------------------------------------------------
    # 🚨 Páginas de erro padrão
    # --------------------------------------------------
    error_page 500 502 503 504 /50x.html;
}
