version: '3.9'

services:
  # =============================
  # 🔹 BACKEND DJANGO + GUNICORN
  # =============================
  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    command: >
      gunicorn auto_data_analysis.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 1000
      --log-level info
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - redis         # ✅ adiciona dependência do Redis
    networks:
      - app-network

  # =============================
  # 🔹 FRONTEND (React + Nginx)
  # =============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 👇 Passa a URL pública da API para o build do Vite
        VITE_API_URL: "https://xclarity.duckdns.org/api"
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    networks:
      - app-network

  # =============================
  # 🔹 REDIS (broker Celery)
  # =============================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  # =============================
  # 🔹 CELERY WORKER
  # =============================
  worker:
    build: ./backend
    container_name: celery-worker
    command: celery -A auto_data_analysis worker --loglevel=INFO
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
    restart: always
    networks:
      - app-network

  # =============================
  # (Opcional) CELERY BEAT - agendador
  # =============================
  # beat:
  #   build: ./backend
  #   container_name: celery-beat
  #   command: celery -A auto_data_analysis beat --loglevel=INFO
  #   env_file:
  #     - ./backend/.env
  #   depends_on:
  #     - redis
  #   restart: always
  #   networks:
  #     - app-network

# =============================
# 🔹 REDE COMPARTILHADA
# =============================
networks:
  app-network:
    driver: bridge
