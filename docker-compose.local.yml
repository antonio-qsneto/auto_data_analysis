services:
  db:
    image: postgres:16-alpine
    container_name: auto-data-analysis-db
    environment:
      POSTGRES_DB: auto_data_analysis
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d auto_data_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auto-data-analysis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: auto-data-analysis-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment: &backend-env
      AUTH_MODE: local
      DJANGO_SECRET_KEY: local-dev-secret
      LOCAL_AUTH_JWT_SECRET: local-dev-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      FRONTEND_URL: "http://localhost:5173"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: auto_data_analysis
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_URL: "redis://redis:6379/0"
      LOCAL_REPORTS_ROOT: /app/local_reports
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: auto-data-analysis-worker
    command: celery -A auto_data_analysis worker --loglevel=INFO
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres-data:
