name: Pipeline CI/CD

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  job1:
    name: build_ecr
    env:
      PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
      INSTANCE_KEY: ${{ secrets.INSTANCE_KEY }}
      DEPLOY_SG_ID: ${{ secrets.DEPLOY_SG_ID }}
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::165814550670:role/GitHubActionsApp
        aws-region: us-east-1

    - name: Amazon ECR Login
      uses: aws-actions/amazon-ecr-login@v2


    # ============================================================
    # 🔓 Abrir SSH temporário
    # ============================================================
    - name: Abrir SSH temporário
      run: |
        MY_IP=$(curl -s https://checkip.amazonaws.com)
        aws ec2 authorize-security-group-ingress \
          --group-id $DEPLOY_SG_ID \
          --protocol tcp \
          --port 22 \
          --cidr "$MY_IP/32" || true


    # ============================================================
    # 📦 Criar .env no servidor
    # ============================================================
    - name: Criar arquivo .env no EC2
      run: |
        echo "$INSTANCE_KEY" > chave-site.pem
        chmod 400 chave-site.pem

        ssh -i chave-site.pem -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP << 'EOF'
          mkdir -p /home/ubuntu/backend;
          mkdir -p /home/ubuntu/frontend;

          cat > /home/ubuntu/backend/.env << 'EENV'
        ${{ secrets.ENV_BACKEND }}
        EENV
          cat > /home/ubuntu/frontend/.env << 'EENV'
        ${{ secrets.ENV_FRONTEND }}
        EENV
        EOF


    # ============================================================
    # 🐳 Build + Push Docker
    # ============================================================
    - name: Build, Tag, Push Docker images
      run: |
        docker build \
          --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
          --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
          -t xclarity-frontend:latest ./frontend

        docker build -t xclarity-backend:latest ./backend

        docker tag xclarity-frontend:latest 165814550670.dkr.ecr.us-east-1.amazonaws.com/xclarity-frontend:latest
        docker tag xclarity-backend:latest 165814550670.dkr.ecr.us-east-1.amazonaws.com/xclarity-backend:latest

        docker push 165814550670.dkr.ecr.us-east-1.amazonaws.com/xclarity-frontend:latest
        docker push 165814550670.dkr.ecr.us-east-1.amazonaws.com/xclarity-backend:latest


    - name: Copiar docker-compose.yml para EC2
      run: |
        scp -i chave-site.pem -o StrictHostKeyChecking=no \
          docker-compose.yml ubuntu@$PUBLIC_IP:/home/ubuntu/docker-compose.yml


    # ============================================================
    # 1️⃣ REMOVER CERTIFICADOS ANTIGOS + CONFIGURAÇÃO TEMPORÁRIA
    # ============================================================
    - name: Apagar certificados antigos + Criar Nginx HTTP temporário
      run: |
        ssh -T -i chave-site.pem -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP << 'EOF'

        echo "Removendo certificados antigos..."
        sudo rm -rf /etc/letsencrypt/live/xclarity.top || true
        sudo rm -rf /etc/letsencrypt/archive/xclarity.top || true
        sudo rm -f /etc/letsencrypt/renewal/xclarity.top.conf || true

        echo "Criando configuração temporária HTTP..."
        sudo bash -c 'cat << "NGINX" > /etc/nginx/sites-available/xclarity.conf
        server {
            listen 80;
            server_name xclarity.top;

            location / {
                proxy_pass http://localhost:8080;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
            }

            location /api/ {
                proxy_pass http://localhost:8000/api/;
            }
        }
        NGINX'

              sudo ln -sf /etc/nginx/sites-available/xclarity.conf /etc/nginx/sites-enabled/xclarity.conf

              sudo systemctl daemon-reload
              sudo nginx -t
              sudo systemctl restart nginx

        EOF


    # ============================================================
    # 2️⃣ CERTBOT (AGORA FUNCIONA SEM ERRO)
    # ============================================================
    - name: Gerar certificados SSL com Certbot (RSA)
      run: |
        ssh -T -i chave-site.pem -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP << 'EOF'
          sudo certbot certonly --nginx \
            --key-type rsa \
            -d xclarity.top \
            --non-interactive \
            --agree-tos \
            -m admin@xclarity.top

          sudo ls -l /etc/letsencrypt/live/xclarity.top/
        EOF


    # ============================================================
    # 3️⃣ CONFIGURAÇÃO FINAL COM SSL
    # ============================================================
    - name: Ativar Nginx com SSL definitivo
      run: |
        ssh -T -i chave-site.pem -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP << 'EOF'

          sudo bash -c 'cat << "NGINX" > /etc/nginx/sites-available/xclarity.conf
          server {
              listen 80;
              server_name xclarity.top;
              return 301 https://\$host\$request_uri;
          }

          server {
              listen 443 ssl;
              server_name xclarity.top;

              ssl_certificate     /etc/letsencrypt/live/xclarity.top/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/xclarity.top/privkey.pem;

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-Proto https;
              }

              location /api/ {
                  proxy_pass http://localhost:8000/api/;
              }
          }
        NGINX'

          sudo nginx -t
          sudo systemctl restart nginx
        EOF


    # ============================================================
    # 🔒 Fechar SSH temporário
    # ============================================================
    - name: Fechar SSH temporário
      if: always()
      run: |
        MY_IP=$(curl -s https://checkip.amazonaws.com)
        aws ec2 revoke-security-group-ingress \
          --group-id $DEPLOY_SG_ID \
          --protocol tcp \
          --port 22 \
          --cidr "$MY_IP/32" || true


  # ============================================================
  # 🚀 Deploy containers
  # ============================================================
  job2:
    name: deploy_ec2
    needs: job1
    env:
      INSTANCE_KEY: ${{ secrets.INSTANCE_KEY }}
      PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        run: |
          echo "$INSTANCE_KEY" > chave-site.pem
          chmod 400 chave-site.pem

          ssh -i chave-site.pem -o StrictHostKeyChecking=no ubuntu@$PUBLIC_IP << 'EOF'

            docker stop $(docker ps -aq) 2>/dev/null || true
            docker rm $(docker ps -aq) 2>/dev/null || true

            docker system prune -af --volumes

            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 165814550670.dkr.ecr.us-east-1.amazonaws.com

            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --remove-orphans

            docker ps
          EOF

          rm chave-site.pem
